<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บทความ</title>
<link rel="stylesheet" href="assets/vendor/hljs.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="./"><span class="mark"></span><span data-site="name"></span></a>
    <nav class="menu"><a href="./">← บทความทั้งหมด</a></nav>
  </div>
</header>

<section class="post-hero"><div class="wrap">
  <div class="crumb"><a href="./">หน้าแรก</a> / <a id="crumbCat" href="./"></a></div>
  <h1 id="title">กำลังโหลด...</h1>
  <div class="meta" id="meta"></div>
</div></section>

<div class="post-wrap">
  <article class="content">
    <div id="cover"></div>
    <div class="md" id="body"></div>
    <div class="share">
      <button type="button" id="copyLink">คัดลอกลิงก์บทความ</button>
      <a id="lineShare" target="_blank" rel="noopener" href="#">แชร์ทาง LINE</a>
      <button type="button" onclick="window.print()">พิมพ์ / PDF</button>
    </div>
    <nav class="pager" id="pager"></nav>
  </article>
  <aside class="toc" id="toc"></aside>
</div>

<footer><div class="wrap"><span>© <span id="yr"></span> <span data-site="name"></span></span><a href="admin.html">ผู้ดูแลระบบ</a></div></footer>

<script src="assets/vendor/marked.min.js"></script>
<script src="assets/vendor/purify.min.js"></script>
<script src="assets/vendor/highlight.min.js"></script>
<script src="assets/common.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  let data; try { data = await loadData(); } catch { return showLoadError(); }
  fillSite(data);
  const slug = new URLSearchParams(location.search).get('p');
  const posts = sortPosts(data.posts).filter(p => !p.draft);
  const i = posts.findIndex(p => p.slug === slug), p = posts[i];
  if (!p) { $('title').textContent = 'ไม่พบบทความนี้'; $('body').innerHTML = '<p><a href="./">กลับหน้าแรก</a></p>'; return; }

  const c = catOf(data, p.category);
  document.title = `${p.title} | ${data.site.name}`;
  $('title').textContent = p.title;
  $('crumbCat').textContent = c.name; $('crumbCat').href = './?cat=' + encodeURIComponent(c.id);
  $('meta').innerHTML = `<a class="cat" href="./?cat=${encodeURIComponent(c.id)}">${esc(c.name)}</a><span>${esc(thDate(p.date))}</span>`
    + (p.tags || []).map(t => `<a class="chip" href="./?tag=${encodeURIComponent(t)}">#${esc(t)}</a>`).join('');
  setCoverBg(document.querySelector('.post-hero'), p.cover);
  $('body').innerHTML = renderMarkdown(p.body);
  enhance($('body'));

  const heads = [...$('body').querySelectorAll('h2, h3')];
  if (heads.length > 1) $('toc').innerHTML = '<h3>ในบทความนี้</h3>' + heads.map(h => `<a class="${h.tagName === 'H3' ? 'l3' : ''}" href="#${h.id}">${esc(h.textContent)}</a>`).join('');

  const url = location.href.split('#')[0];
  $('lineShare').href = 'https://social-plugins.line.me/lineit/share?url=' + encodeURIComponent(url);
  $('copyLink').onclick = async e => { try { await navigator.clipboard.writeText(url); e.target.textContent = 'คัดลอกลิงก์แล้ว ✓'; } catch { prompt('คัดลอกลิงก์นี้', url); } };

  const prev = posts[i + 1], next = posts[i - 1];
  $('pager').innerHTML = (prev ? `<a href="post.html?p=${encodeURIComponent(prev.slug)}"><small>← บทความก่อนหน้า</small>${esc(prev.title)}</a>` : '<span></span>')
    + (next ? `<a class="next" href="post.html?p=${encodeURIComponent(next.slug)}"><small>บทความถัดไป →</small>${esc(next.title)}</a>` : '');
  if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
})();
</script>
</body>
</html>
